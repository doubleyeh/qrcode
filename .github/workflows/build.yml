name: build

on:
  push:
    branches: [wpf]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build qrcode.csproj -c Release -o out

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path out/qrcode.exe,out/qrcode.exe.config,out/QRCoder.dll -DestinationPath qrcode.zip

      - uses: actions/upload-artifact@v4
        with:
          name: qrcode
          path: qrcode.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: qrcode.zip
